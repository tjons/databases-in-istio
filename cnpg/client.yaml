apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: cnpg-client-allow
  namespace: cnpg-cluster
spec: 
  selector:
    matchLabels:
      cnpg.io/cluster: example-pg
  action: ALLOW
  rules:
  - from:
    - source:
        serviceAccounts:
        - cnpg-client/default 
    to:
      - operation:
          ports: ["5432"]
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: psql-client
  name: psql-client
  namespace: cnpg-client
spec:
  containers:
  - image: postgres:18.0 
    command: ["sleep", "infinity"]
    name: psql-client
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
